name: Build, test and publish

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/brick4u/strongswan-ikev1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          tags: strongswan-ikev1:test
          cache-from: type=gha,scope=amd64-test
          cache-to: type=gha,mode=max,scope=amd64-test
      - name: Test IKE interoperability
        shell: bash
        run: |
          set -o pipefail
          python3 tests/integration.py --execute --image strongswan-ikev1:test 2>&1 | tee "$RUNNER_TEMP/integration.log"
      - name: Annotate integration failure
        if: failure()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/integration.log" ]]; then
            python3 - <<'PY'
          import os, pathlib
          text = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'integration.log').read_text()[-6000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Integration test failed::' + text)
          PY
            {
              echo '### Sanitized integration diagnostics'
              echo '```text'
              tail -n 200 "$RUNNER_TEMP/integration.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Read upstream version
        id: version
        shell: bash
        run: |
          version=$(sed -nE 's/^ENV VERSION="?([0-9]+\.[0-9]+\.[0-9]+)"?\s*$/\1/p' Dockerfile)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ${{ env.IMAGE }}:master
            ${{ env.IMAGE }}:${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          cache-from: |
            type=gha,scope=multi-platform
            type=gha,scope=amd64-test
          cache-to: type=gha,mode=max,scope=multi-platform
