name: Build, test and publish

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/brick4u/strongswan-ikev1

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Read upstream version
        id: version
        shell: bash
        run: |
          version=$(sed -nE 's/^ENV VERSION="?([0-9]+\.[0-9]+\.[0-9]+)"?\s*$/\1/p' Dockerfile)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          tags: strongswan-ikev1:test
          cache-from: type=gha,scope=amd64-test
          cache-to: type=gha,mode=max,scope=amd64-test
      - name: Test IKE interoperability
        shell: bash
        run: |
          set -o pipefail
          python3 tests/integration.py --execute --image strongswan-ikev1:test 2>&1 | tee "$RUNNER_TEMP/integration.log"
      - name: Annotate integration failure
        if: failure()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/integration.log" ]]; then
            python3 - <<'PY'
          import os, pathlib
          text = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'integration.log').read_text()[-6000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Integration test failed::' + text)
          PY
            {
              echo '### Sanitized integration diagnostics'
              echo '```text'
              tail -n 200 "$RUNNER_TEMP/integration.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    uses: docker/github-builder/.github/workflows/build.yml@cbc9d42f8c89a55623392aadd03600965b80e963 # v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      distribute: true
      runner: |
        default=ubuntu-24.04
        linux/arm64=ubuntu-24.04-arm
      cache: false
      meta-images: ghcr.io/brick4u/strongswan-ikev1
      meta-tags: |
        type=raw,value=${{ needs.test.outputs.version }}
        type=raw,value=master
      meta-flavor: latest=false
      set-meta-labels: true
      labels: |
        org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        org.opencontainers.image.revision=${{ github.sha }}
        org.opencontainers.image.version=${{ needs.test.outputs.version }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
